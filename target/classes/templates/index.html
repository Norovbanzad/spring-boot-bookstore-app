<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Home')}"></head>

<body>
<header th:replace="~{layout :: header}"></header>

<div class="container" th:if="${flashMessage}">
    <div class="alert alert-success" th:text="${flashMessage}"></div>
</div>

<section class="hero">
    <div class="container hero-content">
        <h1>Find your next <span>great read</span></h1>
        <p class="hero-sub">Browse our curated collection of classic and modern books. All at your fingertips.</p>
        <div class="hero-actions">
            <a th:href="@{/books}" class="btn btn-primary">Browse Books</a>
            <a th:href="@{/books/new}" class="btn btn-outline">Add a Book</a>
        </div>
        <div class="hero-stats">
            <div class="stat">
                <span class="stat-number" th:text="${totalBooks}">0</span>
                <span class="stat-label">Total Titles</span>
            </div>
            <div class="stat">
                <span class="stat-number" th:text="${booksInStock}">0</span>
                <span class="stat-label">In Stock</span>
            </div>
        </div>
    </div>
</section>

<section class="section container">
    <div class="section-head">
        <h2>Featured Books</h2>
        <a th:href="@{/books}" class="text-link">View all &rarr;</a>
    </div>
    <div class="book-grid" th:if="${!#lists.isEmpty(featuredBooks)}">
        <article class="book-card" th:each="book : ${featuredBooks}">
            <div class="book-cover" th:text="${#strings.substring(book.title, 0, 1)}">T</div>
            <div class="book-info">
                <h3 class="book-title"><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a></h3>
                <p class="book-author" th:text="${book.author}">Author</p>
                <div class="book-meta">
                    <span class="badge" th:classappend="${book.stock > 0} ? 'badge-stock' : 'badge-out'"
                          th:text="${book.stock > 0} ? 'In stock' : 'Out of stock'">In stock</span>
                    <span class="book-price" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</span>
                </div>
            </div>
        </article>
    </div>
    <p class="empty-state" th:unless="${!#lists.isEmpty(featuredBooks)}">No books available yet.</p>
</section>

<footer th:replace="~{layout :: footer}"></footer>
</body>

</html>
