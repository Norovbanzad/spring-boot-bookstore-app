<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Add / Edit Book')}"></head>

<body>
<header th:replace="~{layout :: header}"></header>

<main class="container main-content narrow">
    <div class="section-head">
        <h1 th:text="${book.id == null} ? 'Add a New Book' : 'Edit Book'">Add a New Book</h1>
        <a th:href="@{/books}" class="text-link">&larr; Back to catalog</a>
    </div>

    <form th:action="@{/books}" th:object="${book}" method="post" class="book-form">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" placeholder="e.g. Pride and Prejudice">
            <p class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}" placeholder="e.g. Jane Austen">
                <p class="form-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></p>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" placeholder="e.g. 978-0141439518">
                <p class="form-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></p>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" placeholder="0.00">
                <p class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
            </div>

            <div class="form-group">
                <label for="publishedDate">Publication Date</label>
                <input type="date" id="publishedDate" th:field="*{publishedDate}">
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" th:field="*{stock}" min="0" step="1" placeholder="0">
                <p class="form-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="5"
                      placeholder="A short synopsis or notes about the book..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${book.id == null} ? 'Add Book' : 'Save Changes'">Save</button>
            <a th:href="@{/books}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>

</html>
