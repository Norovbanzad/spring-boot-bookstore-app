<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head(${book.title})}"></head>

<body>
<header th:replace="~{layout :: header}"></header>

<main class="container main-content">
    <div class="section-head">
        <a th:href="@{/books}" class="text-link">&larr; Back to catalog</a>
    </div>

    <article class="book-detail">
        <div class="book-cover book-cover-lg" th:text="${#strings.substring(book.title, 0, 1)}">T</div>
        <div class="book-detail-info">
            <h1 th:text="${book.title}">Title</h1>
            <p class="book-author" th:text="'by ' + ${book.author}">by Author</p>

            <dl class="book-specs">
                <div>
                    <dt>ISBN</dt>
                    <dd class="mono" th:text="${book.isbn}">ISBN</dd>
                </div>
                <div>
                    <dt>Published</dt>
                    <dd th:text="${book.publishedDate} != null ? ${#temporals.format(book.publishedDate, 'MMM d, yyyy')} : 'Unknown'">Date</dd>
                </div>
                <div>
                    <dt>Price</dt>
                    <dd class="price" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</dd>
                </div>
                <div>
                    <dt>Availability</dt>
                    <dd>
                        <span class="badge" th:classappend="${book.stock > 0} ? 'badge-stock' : 'badge-out'"
                              th:text="${book.stock > 0} ? ${book.stock} + ' in stock' : 'Out of stock'">In stock</span>
                    </dd>
                </div>
            </dl>

            <div class="book-description" th:if="${book.description}">
                <h2>About this book</h2>
                <p th:text="${book.description}">Description</p>
            </div>

            <div class="detail-actions">
                <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-primary">Edit Book</a>
                <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post"
                      class="inline-form"
                      onsubmit="return confirmDelete('${book.title}');">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </article>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>

</html>
