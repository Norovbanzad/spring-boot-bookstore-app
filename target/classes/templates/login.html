<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device=width, initial-scale=1.0">
<title>Login | Bookstore</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
	<div class="auth-card">
		<h1> Bookstore Login</h1>
		
		<p class="subtitle">Sign in to your account</p>
		
		<div class="message success" th:if="${param.registered}">
			Registration completed successfully. You can now log in.
		</div>
		
		<div class="message error-message" th:if="${param.error}">
			Invalid email or password.
		</div>
		
		<div class="message success" th:if="${param.logout}">
			You have been logged out.
		</div>
		
		<form th:action="@{/login}" method="post">
			<div class="form-group">
				<label for="username">Email</label>
				<input id="username" type="email" name="username" placeholder="you@example.com" required autofocus>
			</div>
			
			<div class="form-group">
				<label for="password">Password</label>
				<input id="password" type="password" name="password" required>
			</div>
			
			<button type="submit" class="primary-button">Login</button>
		</form>
		
		<p class="login-link">Don't have an account? <a th:href="@{/register}">Register</a></p>
		
	</div>
</div>
</body>
</html>
