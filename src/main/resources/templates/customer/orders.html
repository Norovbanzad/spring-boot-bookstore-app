<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>My Orders</title>
<link rel="stylesheet" th:href="@{/css/customer-orders.css}">

</head>
<body>
	<header class="site-header">
        <div class="container nav">
            <a th:href="@{/shop}" class="logo"> Bookstore</a>

            <nav>
                <a th:href="@{/shop}">Shop</a>
                 <a th:href="@{/customer/cart}">Cart</a>
                  <a th:href="@{/customer}">Dashboard</a>
            </nav>
        </div>

    </header>
    <main class="container">
        <div class="page-header">
            <div>
                <h1>My Orders</h1>
                <p>View your orders history and current status</p>
            </div>
            <a class="button" th:href="@{/shop}">Continue shopping</a>
        </div>
       <section class="empty-state" th:if="${#lists.isEmpty(orders)}">
            <h2>No orders yet</h2>
            <p>You have not placed any orders</p>
            <a th:href="@{/shop}" class="button">Brows books</a>
       </section>

       <section class="orders" th:unless="${#lists.isEmpty(orders)}">
            <article class="order-card" th:each="order: ${orders}">
                <div class="order-main">
                    <h2>Order # <span th:text="${order.id}"></span></h2>
                    <p class="muted">Placed <span th:text="${order.createdAt}"></span></p>
                </div>

                <div>
                    <span class="status-badge" th:text="${order.status}">PENDING</span>
                </div>
                <div class="order-total">
                    <span class="muted">
                        Total
                    </span>
                    <strong th:text="|${order.totalAmount} ₮|">
                        0 ₮
                    </strong>
                </div>
                <div>
                    <a class="detail-link" th:href="@{/customer/orders/{id}(id=${order.id})}">
                        View Details
                    </a>
                </div>
            </article>

       </section>
    </main>

</body>
</html>
