<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Books')}"></head>

<body>
<header th:replace="~{layout :: header}"></header>

<div class="container" th:if="${flashMessage}">
    <div class="alert alert-success" th:text="${flashMessage}"></div>
</div>

<main class="container main-content">
    <div class="section-head">
        <h1>Book Catalog</h1>
        <a th:href="@{/books/new}" class="btn btn-primary">Add Book</a>
    </div>

    <form method="get" action="/books" class="search-bar" role="search">
        <input type="search" name="q" id="search-input"
               placeholder="Search by title, author or ISBN..."
               th:value="${q}"
               data-search-url="/api/books">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p class="search-hint" id="live-search-hint" hidden>
        Showing live results for "<span id="live-search-term"></span>". <a href="/books">Clear</a>
    </p>

    <div id="book-results" th:if="${books}">
        <p class="results-count" th:text="${#lists.size(books)} + ' book(s) found'">0 books found</p>

        <div class="table-wrap">
            <table class="book-table">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th class="ta-right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}" th:classappend="${book.stock == 0} ? 'row-out'">
                    <td>
                        <a class="book-link" th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a>
                    </td>
                    <td th:text="${book.author}">Author</td>
                    <td class="mono" th:text="${book.isbn}">ISBN</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</td>
                    <td>
                        <span class="badge" th:classappend="${book.stock > 0} ? 'badge-stock' : 'badge-out'"
                              th:text="${book.stock > 0} ? ${book.stock} + ' in stock' : 'Out of stock'">In stock</span>
                    </td>
                    <td class="ta-right">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline">Edit</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post"
                              class="inline-form"
                              onsubmit="return confirmDelete('${book.title}');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="empty-state" th:if="${#lists.isEmpty(books)}">No books match your search.</p>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>

</html>
