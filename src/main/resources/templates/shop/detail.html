<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title th:text="${book.title + ' | Bookstore'}">Book | Bookstore</title>
<link rel="stylesheet" th:href="@{/css/shop.css}">
<script th:src="@{/js/shop-detail.js}" defer></script>
</head>

<body>. 
	<header class="site-header">
		<div class="container nav">
			<a class="logo" th:href="@{/shop}">
				Bookstore
			</a>
		</div>
	</header>
	
	<main class="container">
		<a class="back-link" th:href="@{/shop}">Back to books</a>
		<section class="book-detail">
			<div class="detail=cover">Book</div>
			<div class="detail-content">
				<p class="category" th:text="${book.categoryName}">
					Programming
				</p>
				<h1 th:text="${book.title}">Clean code</h1>
				
				<p class="author">By
					<strong>
					<span th:text="${book.authorFirstName}"></span>
					<span th:text="${book.authorLastName}"></span>
					</strong>
				</p>
				
				<dl>
					<div>
						<dt>ISBN</dt>
						<dd th:text="${book.isbn}"></dd>		
					</div>
					
					<div>
						<dt>PRICE</dt>
						<dd th:text="${book.price + '₮'}"></dd>		
					</div>
					
					<div>
						<dt>Available Stock</dt>
						<dd th:text="${book.stockQuantity}"></dd>		
					</div>
				</dl>
				
				<button type="button" id="add-to-cart-button" 
						th:data-book-id="${book.id}"
						th:disabled="${book.stockQuantity == 0}">Add to cart</button>
				
			</div>
		</section>
	</main>
</body>
</html>
