<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book Management</title>

    <link rel="stylesheet" th:href="@{/css/books.css}" />

    <script defer th:src="@{/js/books.js}"></script>
  </head>

  <body>
    <div class="container">
      <section class="card">
        <h1>Book Management</h1>

        <p id="message" class="message" hidden></p>

        <form id="book-form">
          <input type="hidden" id="book-id" />

          <div class="form-group">
            <label for="book-title"> Title </label>
            <input type="text" id="book-title" required />
          </div>

          <div class="form-group">
            <label for="book-isbn"> ISBN </label>
            <input type="text" id="book-isbn" required />
          </div>

          <div class="form-group">
            <label for="book-price"> Price </label>
            <input type="number" id="book-price" min="0" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="book-stock"> Stock Quantity </label>
            <input type="number" id="book-stock" min="0" required />
          </div>

          <div class="form-group">
            <label for="book-category"> Category </label>
            <select id="book-category" required>
              <option value="">Select Category</option>
            </select>
          </div>

          <div class="form-group">
            <label for="book-author"> Author </label>
            <select id="book-author" required>
              <option value="">Select Author</option>
            </select>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="book-active" checked />

            <label for="book-active"> Active </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="save-button">Save Book</button>

            <button type="button" id="cancel-button" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="table-header">
          <h2>Books</h2>

          <button type="button" id="refresh-button">Refresh</button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>ISBN</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Category</th>
                <th>Author</th>
                <th>Active</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="book-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </body>
</html>
