<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register | Bookstore</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
	<div class="auth-container">
		<div class="auth-card">
			<h1>Create Account</h1>

			<p class="subtitle">Register as Bookstore customer</p>

			<form th:action="@{/register}" th:object="${registerRequest}"
				method="post">
				<div class="form-group">
					<label for="firstName">First Name</label> <input id="firstName"
						type="text" th:field="*{firstName}">

					<p class="error" th:if=${#fields.hasErrors('firstName')} th:errors="*{firstName}"></p>
				</div>

				<div class="form-group">
					<label for="lastName">Last Name</label> <input id="lastName"
						type="text" th:field="*{lastName}">

					<p class="error" th:if=${#fields.hasErrors('lastName')} th:errors="*{lastName}"></p>
				</div>

				<div class="form-group">
					<label for="email">Email</label> 
					<input id="email" type="email" th:field="*{email}">

					<p class="error" th:if=${#fields.hasErrors('email')} th:errors="*{email}"></p>
				</div>

				<div class="form-group">
					<label for="password">Password</label> 
					<input id="password" type="password" th:field="*{password}">

					<p class="error" th:if=${#fields.hasErrors('password')} th:errors="*{password}"></p>
				</div>
				<button type="submit" class="primary-button">Register</button>

			</form>

			<p class="login-link">
				Already have an account? <a th:href="@{/login}">Login</a>
			</p>
		</div>
	</div>
</body>
</html>
